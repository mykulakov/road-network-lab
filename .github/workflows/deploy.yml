name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test

      - name: Publish
        run: dotnet publish RoadNetworkLab.Web -c Release -o release

      - name: Set base path for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/road-network-lab/" />|' release/wwwroot/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4